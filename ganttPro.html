<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GanttPro — Planification de projet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1117;
    --surface: #161B22;
    --surface2: #1C2128;
    --surface3: #21262D;
    --border: #30363D;
    --border2: #3D444D;
    --text: #E6EDF3;
    --text2: #8B949E;
    --text3: #6E7681;
    --accent: #58A6FF;
    --accent-dim: #1F3A5F;
    --milestone: #F0A500;
    --milestone-dim: #3D2A00;
    --summary: #BC8CFF;
    --summary-dim: #2D1F4E;
    --success: #3FB950;
    --danger: #F85149;
    --warning: #D29922;
    --today: #FF6B6B;
    --bar-h: 22px;
    --row-h: 38px;
    --header-h: 56px;
    --list-w: 400px;
  }
  body.light {
    --bg: #FFFFFF;
    --surface: #F6F8FA;
    --surface2: #EAEEF2;
    --surface3: #D0D7DE;
    --border: #D0D7DE;
    --border2: #AFB8C1;
    --text: #1F2328;
    --text2: #57606A;
    --text3: #8C959F;
    --accent: #0969DA;
    --accent-dim: #DDF4FF;
    --milestone: #BF8700;
    --milestone-dim: #FFF8C5;
    --summary: #8250DF;
    --summary-dim: #FBEFFF;
    --today: #CF222E;
  }
  #theme-toggle {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 500;
    transition: all .15s;
    white-space: nowrap;
  }
  #theme-toggle:hover { background: var(--surface3); color: var(--text); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }

  /* ─── TOOLBAR ─── */
  #toolbar {
    height: 48px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 4px;
    flex-shrink: 0;
    user-select: none;
  }
  #project-name {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    min-width: 140px;
    max-width: 200px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  #project-name:hover, #project-name:focus {
    background: var(--surface3);
    cursor: text;
  }
  .tb-sep { width: 1px; height: 24px; background: var(--border); margin: 0 6px; }
  .tb-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 500;
    transition: all .15s;
    white-space: nowrap;
  }
  .tb-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--border); }
  .tb-btn.primary { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  .tb-btn.primary:hover { background: var(--accent); color: #fff; }
  .tb-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
  .tb-btn svg { flex-shrink: 0; }
  .zoom-group { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .zoom-btn {
    padding: 5px 10px;
    background: transparent;
    border: none;
    color: var(--text2);
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 500;
    transition: all .15s;
  }
  .zoom-btn:not(:last-child) { border-right: 1px solid var(--border); }
  .zoom-btn:hover { background: var(--surface3); color: var(--text); }
  .zoom-btn.active { background: var(--accent-dim); color: var(--accent); }
  #toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }

  /* ─── MAIN ─── */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  /* ─── LEFT PANEL ─── */
  #left-panel {
    width: var(--list-w);
    min-width: 220px;
    max-width: 70%;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    overflow: hidden;
  }
  #list-header {
    height: var(--header-h);
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 90px 90px 70px;
    align-items: center;
    padding: 0 8px;
    flex-shrink: 0;
    gap: 0;
  }
  .lh-cell {
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 0 6px;
  }
  /* ─── SEARCH ─── */
  .search-wrapper {
    display: flex;
    align-items: center;
    flex: 1;
    margin-left: 6px;
    position: relative;
  }
  #search-input {
    width: 100%;
    padding: 3px 22px 3px 8px;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    outline: none;
    transition: border-color .15s;
  }
  #search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(88,166,255,.12); }
  #search-input::placeholder { color: var(--text3); }
  #search-clear {
    position: absolute;
    right: 4px;
    width: 14px; height: 14px;
    display: none;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    font-size: 11px;
    padding: 0;
  }
  #search-clear:hover { color: var(--text); }
  #search-clear.visible { display: flex; }
  .search-count {
    font-size: 10px;
    color: var(--accent);
    white-space: nowrap;
    margin-left: 4px;
  }
  #task-list-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  #task-list-body::-webkit-scrollbar { width: 6px; }
  #task-list-body::-webkit-scrollbar-track { background: transparent; }
  #task-list-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .task-row {
    height: var(--row-h);
    display: grid;
    grid-template-columns: 1fr 90px 90px 70px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
    cursor: pointer;
    transition: background .1s;
    position: relative;
  }
  .task-row:hover { background: var(--surface2); }
  .task-row.selected { background: var(--accent-dim); outline: 1px solid var(--accent); outline-offset: -1px; }
  .task-row.summary-row { background: rgba(188,140,255,.04); }
  .task-row.summary-row:hover { background: rgba(188,140,255,.09); }

  .task-name-cell {
    display: flex;
    align-items: center;
    gap: 4px;
    overflow: hidden;
    padding: 0 4px;
  }
  .collapse-btn {
    flex-shrink: 0;
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 3px;
    border: none;
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-size: 10px;
    transition: transform .2s;
  }
  .collapse-btn:hover { background: var(--surface3); }
  .collapse-btn.collapsed { transform: rotate(-90deg); }
  .type-icon { flex-shrink: 0; }
  .task-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 400;
  }
  .task-label.summary { font-weight: 600; color: var(--summary); }
  .task-label.milestone { color: var(--milestone); }
  mark { background: var(--accent-dim); color: var(--accent); border-radius: 2px; padding: 0 1px; }

  .task-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text2);
    padding: 0 6px;
    cursor: pointer;
    border-radius: 4px;
    transition: background .1s, color .1s;
    position: relative;
  }
  .task-date:hover { background: var(--surface3); color: var(--text); }
  .task-date.editing { padding: 0; background: transparent; cursor: default; }
  .inline-date-input {
    width: 100%;
    height: 100%;
    padding: 2px 6px;
    background: var(--surface2);
    border: 1.5px solid var(--accent);
    border-radius: 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    outline: none;
    box-shadow: 0 0 0 3px rgba(88,166,255,.15);
    color-scheme: dark;
  }
  body.light .inline-date-input { color-scheme: light; }
  .task-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    opacity: 0;
    transition: opacity .1s;
  }
  .task-row:hover .task-actions { opacity: 1; }

  /* Drag handle */
  .drag-grip {
    flex-shrink: 0;
    width: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    cursor: grab;
    color: var(--text3);
    transition: opacity .1s;
    margin-right: 2px;
  }
  .task-row:hover .drag-grip { opacity: 1; }
  .drag-grip:active { cursor: grabbing; }

  .drop-indicator {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    pointer-events: none;
    z-index: 20;
    border-radius: 1px;
    box-shadow: 0 0 6px var(--accent);
  }
  .drop-indicator.top { top: -1px; }
  .drop-indicator.bottom { bottom: -1px; }
  .task-row.dragging-row { opacity: .4; background: var(--accent-dim) !important; }

  .act-btn {
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    transition: all .1s;
  }
  .act-btn:hover { background: var(--surface3); color: var(--text); }
  .act-btn.danger:hover { background: rgba(248,81,73,.15); color: var(--danger); }

  /* ─── SPLITTER ─── */
  #splitter {
    width: 5px;
    cursor: col-resize;
    background: var(--border);
    flex-shrink: 0;
    transition: background .15s;
    position: relative;
    z-index: 10;
  }
  #splitter:hover, #splitter.dragging { background: var(--accent); }

  /* ─── RIGHT PANEL ─── */
  #right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #gantt-header {
    height: var(--header-h);
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }
  #gantt-header-svg { position: absolute; top: 0; left: 0; pointer-events: none; }
  #gantt-body { flex: 1; overflow: auto; position: relative; }
  #gantt-body::-webkit-scrollbar { width: 6px; height: 6px; }
  #gantt-body::-webkit-scrollbar-track { background: transparent; }
  #gantt-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  #gantt-canvas { position: relative; }
  .gantt-row-bg {
    position: absolute; left: 0; right: 0;
    height: var(--row-h);
    border-bottom: 1px solid var(--border);
  }
  .gantt-row-bg.even { background: transparent; }
  .gantt-row-bg.odd { background: rgba(255,255,255,.015); }
  .gantt-row-bg.summary { background: rgba(188,140,255,.03); }
  .grid-line {
    position: absolute; top: 0; width: 1px;
    background: var(--border); opacity: .5;
    pointer-events: none;
  }
  .today-line {
    position: absolute; top: 0; width: 2px;
    background: var(--today); opacity: .7;
    pointer-events: none; z-index: 5;
  }
  .today-line::after {
    content: 'Aujourd\'hui';
    position: absolute; top: 2px; left: 4px;
    font-size: 10px; color: var(--today);
    font-family: 'Outfit', sans-serif;
    font-weight: 600; white-space: nowrap;
  }

  /* ─── GANTT BARS ─── */
  .gantt-bar-wrapper {
    position: absolute; display: flex; align-items: center;
    cursor: pointer; z-index: 3;
  }
  .gantt-bar {
    height: var(--bar-h);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    min-width: 4px;
    transition: filter .1s;
  }
  .gantt-bar:hover { filter: brightness(1.15); }
  .gantt-bar.standard { background: linear-gradient(135deg, #3B82F6, #2563EB); border: 1px solid #60A5FA44; }
  .gantt-bar.summary-bar {
    border-radius: 3px; height: 18px;
    background: linear-gradient(135deg, #8B5CF6, #6D28D9);
    border: 1px solid #A78BFA44;
  }
  /* ─── PROGRESS BAR ─── */
  .progress-fill {
    position: absolute;
    left: 0; top: 0; height: 100%;
    background: rgba(255,255,255,.22);
    pointer-events: none;
    border-radius: 4px 0 0 4px;
    transition: width .3s ease;
  }
  .gantt-bar .bar-label {
    position: absolute; inset: 0;
    display: flex; align-items: center;
    padding: 0 6px;
    font-size: 11px; font-weight: 500;
    color: rgba(255,255,255,.9);
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    pointer-events: none;
    z-index: 1;
  }
  .bar-label-outside {
    position: absolute; left: calc(100% + 6px);
    font-size: 11px; color: var(--text2);
    white-space: nowrap; pointer-events: none;
  }
  .milestone-diamond {
    position: absolute; width: 14px; height: 14px;
    background: var(--milestone);
    border: 2px solid #FBBF2488;
    transform: rotate(45deg);
    cursor: pointer; z-index: 4;
    transition: filter .1s, transform .1s;
    box-shadow: 0 0 8px rgba(240,165,0,.4);
  }
  .milestone-diamond:hover { filter: brightness(1.3); transform: rotate(45deg) scale(1.15); }
  .milestone-label {
    position: absolute; font-size: 11px;
    color: var(--milestone); white-space: nowrap;
    font-weight: 500; pointer-events: none;
  }
  .summary-cap-left, .summary-cap-right {
    position: absolute; bottom: -4px;
    width: 0; height: 0; z-index: 2;
  }
  .summary-cap-left { left: 0; border-left: 6px solid transparent; border-right: 0; border-top: 6px solid #8B5CF6; }
  .summary-cap-right { right: 0; border-left: 0; border-right: 6px solid transparent; border-top: 6px solid #8B5CF6; }
  .drag-handle-left, .drag-handle-right {
    position: absolute; top: 0; bottom: 0; width: 6px;
    cursor: ew-resize; z-index: 5; opacity: 0; transition: opacity .15s;
  }
  .drag-handle-left { left: 0; background: linear-gradient(to right, rgba(255,255,255,.4), transparent); border-radius: 4px 0 0 4px; }
  .drag-handle-right { right: 0; background: linear-gradient(to left, rgba(255,255,255,.4), transparent); border-radius: 0 4px 4px 0; }
  .gantt-bar:hover .drag-handle-left,
  .gantt-bar:hover .drag-handle-right { opacity: 1; }

  /* ─── DRAG DATE TOOLTIP ─── */
  #drag-date-tip {
    position: fixed;
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 4px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    pointer-events: none;
    z-index: 1001;
    display: none;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  #drag-date-tip.visible { display: block; }

  /* ─── STATUS BAR ─── */
  #statusbar {
    height: 26px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 16px; gap: 24px;
    font-size: 11px; color: var(--text3);
    flex-shrink: 0;
  }
  .sb-item span { color: var(--text2); font-weight: 500; }

  /* ─── MODAL ─── */
  #modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none; align-items: center; justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px;
    width: 520px; max-width: 95vw; max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 24px 64px rgba(0,0,0,.6);
    animation: modal-in .2s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modal-in {
    from { opacity: 0; transform: scale(.92) translateY(12px); }
    to { opacity: 1; transform: none; }
  }
  #modal-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  #modal-title { font-size: 16px; font-weight: 600; }
  #modal-close {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px; border: none;
    background: transparent; color: var(--text2); cursor: pointer; font-size: 18px;
  }
  #modal-close:hover { background: var(--surface3); color: var(--text); }
  #modal-body { padding: 20px 24px; }
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text2); text-transform: uppercase;
    letter-spacing: .06em; margin-bottom: 6px;
  }
  .form-input, .form-textarea, .form-select {
    width: 100%; padding: 9px 12px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    font-family: 'Outfit', sans-serif; font-size: 13px;
    outline: none; transition: border-color .15s;
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88,166,255,.15);
  }
  .form-textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-badge {
    display: inline-flex; align-items: center;
    padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600; margin-top: 8px;
  }
  .badge-standard { background: var(--accent-dim); color: var(--accent); }
  .badge-milestone { background: var(--milestone-dim); color: var(--milestone); }
  .badge-summary { background: var(--summary-dim); color: var(--summary); }
  /* Progress slider */
  .progress-row {
    display: flex; align-items: center; gap: 10px;
  }
  .progress-row input[type=range] {
    flex: 1; accent-color: var(--accent); cursor: pointer;
  }
  .progress-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--accent);
    min-width: 34px; text-align: right;
  }
  #modal-footer {
    padding: 16px 24px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px;
  }
  .btn {
    padding: 8px 16px; border-radius: 8px;
    border: 1px solid var(--border);
    font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .15s;
  }
  .btn-ghost { background: transparent; color: var(--text2); }
  .btn-ghost:hover { background: var(--surface3); color: var(--text); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-danger { background: rgba(248,81,73,.15); color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }

  /* ─── CONFIRM DIALOG ─── */
  #confirm-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
    z-index: 200; display: none; align-items: center; justify-content: center;
  }
  #confirm-overlay.open { display: flex; }
  #confirm-box {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 12px; width: 380px; padding: 24px;
    box-shadow: 0 24px 64px rgba(0,0,0,.6); animation: modal-in .15s ease;
  }
  #confirm-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  #confirm-msg { font-size: 13px; color: var(--text2); margin-bottom: 20px; line-height: 1.6; }
  #confirm-btns { display: flex; justify-content: flex-end; gap: 8px; }

  /* ─── EMPTY STATE ─── */
  #empty-state {
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; gap: 12px; color: var(--text3);
  }
  #empty-state svg { opacity: .3; }
  #empty-state p { font-size: 14px; }
  #empty-state.visible { display: flex; }

  /* ─── EXPORT MODAL ─── */
  .export-option {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); margin-bottom: 8px;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .export-option:hover { border-color: var(--accent); background: var(--accent-dim); }

<script>
// ═══════════════════════════════════════════════════
// DATA MODEL & STATE
// ═══════════════════════════════════════════════════
let tasks = [];
let nextId = 1;
let selectedTaskId = null;
let dragState = null;
let currentZoom = 'days';
let currentTheme = 'dark';
let searchQuery = '';

// ─── UNDO / REDO ───
let undoStack = [];
let redoStack = [];
const UNDO_LIMIT = 50;

function pushUndo() {
  undoStack.push({ tasks: JSON.parse(JSON.stringify(tasks)), nextId });
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack = [];
  updateUndoRedoBtns();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push({ tasks: JSON.parse(JSON.stringify(tasks)), nextId });
  const state = undoStack.pop();
  tasks = state.tasks;
  nextId = state.nextId;
  updateUndoRedoBtns();
  render();
  showSaveIndicator('Annulation ✓');
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push({ tasks: JSON.parse(JSON.stringify(tasks)), nextId });
  const state = redoStack.pop();
  tasks = state.tasks;
  nextId = state.nextId;
  updateUndoRedoBtns();
  render();
  showSaveIndicator('Rétablissement ✓');
}

function updateUndoRedoBtns() {
  document.getElementById('undo-btn').disabled = undoStack.length === 0;
  document.getElementById('redo-btn').disabled = redoStack.length === 0;
}

// ─── THEME ───
const THEMES = {
  dark: {
    bg: '#0D1117', surface: '#161B22', surface2: '#1C2128',
    border: '#30363D', text: '#E6EDF3', text2: '#8B949E',
    accent: '#58A6FF', today: '#FF6B6B',
    rowEven: '#0D1117', rowOdd: '#111820', rowSum: '#1A1A2E', legendBg: '#161B22',
  },
  light: {
    bg: '#FFFFFF', surface: '#F6F8FA', surface2: '#EAEEF2',
    border: '#D0D7DE', text: '#1F2328', text2: '#57606A',
    accent: '#0969DA', today: '#CF222E',
    rowEven: '#FFFFFF', rowOdd: '#F6F8FA', rowSum: '#F3EEFF', legendBg: '#F6F8FA',
  }
};

function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.body.classList.toggle('light', currentTheme === 'light');
  document.getElementById('theme-label').textContent = currentTheme === 'dark' ? 'Clair' : 'Sombre';
  render();
}

let editingTaskId = null;
let editingParentId = null;
let editingForcedType = null;

const ZOOM_CONFIG = { days: 28, weeks: 10, months: 4, years: 1.5 };
function getPxPerDay() { return ZOOM_CONFIG[currentZoom]; }

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function parseDate(s) {
  if (!s) return null;
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}

function formatDate(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}

function dateDiff(a, b) {
  return Math.round((parseDate(b) - parseDate(a)) / 86400000);
}

function addDays(dateStr, n) {
  const d = parseDate(dateStr);
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function minDate(a, b) { return a < b ? a : b; }
function maxDate(a, b) { return a > b ? a : b; }

function getTaskType(task) {
  if (task.type === 'summary') return 'summary';
  if (task.startDate === task.endDate) return 'milestone';
  return 'standard';
}

function getChildren(parentId) {
  return tasks.filter(t => t.parentId === parentId);
}

function getDescendants(id) {
  const result = [];
  const q = [id];
  while (q.length) {
    const cur = q.shift();
    const ch = tasks.filter(t => t.parentId === cur);
    ch.forEach(c => { result.push(c.id); q.push(c.id); });
  }
  return result;
}

function recalcSummary(id) {
  const task = tasks.find(t => t.id === id);
  if (!task || task.type !== 'summary') return;
  const children = getChildren(id);
  if (children.length === 0) return;
  task.startDate = children.reduce((m,c) => minDate(m, c.startDate), children[0].startDate);
  task.endDate = children.reduce((m,c) => maxDate(m, c.endDate), children[0].endDate);
}

function recalcAllSummaries() {
  const order = [];
  const visit = (id) => {
    getChildren(id).forEach(c => visit(c.id));
    if (id !== null) order.push(id);
  };
  visit(null);
  order.forEach(id => recalcSummary(id));
}

// ═══════════════════════════════════════════════════
// VISIBLE ROWS (search + collapse)
// ═══════════════════════════════════════════════════
function getVisibleRows() {
  if (searchQuery) {
    // Find matching tasks and their ancestors
    const matchIds = new Set();
    tasks.forEach(t => {
      if (t.name.toLowerCase().includes(searchQuery)) {
        matchIds.add(t.id);
        let cur = t;
        while (cur.parentId !== null) {
          const parent = tasks.find(p => p.id === cur.parentId);
          if (!parent) break;
          matchIds.add(parent.id);
          cur = parent;
        }
      }
    });
    const rows = [];
    const visit = (parentId, level) => {
      tasks.filter(t => t.parentId === parentId).sort((a,b) => a.order - b.order).forEach(t => {
        if (!matchIds.has(t.id)) return;
        rows.push({ task: t, level });
        if (t.type === 'summary' && !t.collapsed) visit(t.id, level + 1);
      });
    };
    visit(null, 0);
    return rows;
  }

  const rows = [];
  const visit = (parentId, level) => {
    tasks.filter(t => t.parentId === parentId).sort((a,b) => a.order - b.order).forEach(t => {
      rows.push({ task: t, level });
      if (t.type === 'summary' && !t.collapsed) visit(t.id, level + 1);
    });
  };
  visit(null, 0);
  return rows;
}

// ─── SEARCH HANDLERS ───
function onSearch(val) {
  searchQuery = val.trim().toLowerCase();
  const clearBtn = document.getElementById('search-clear');
  clearBtn.classList.toggle('visible', searchQuery.length > 0);
  render();
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  searchQuery = '';
  document.getElementById('search-clear').classList.remove('visible');
  document.getElementById('search-count').textContent = '';
  render();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════════════
// PROJECT DATE RANGE
// ═══════════════════════════════════════════════════
function getProjectRange() {
  const visible = tasks.filter(t => t.startDate && t.endDate);
  if (!visible.length) {
    const t = today();
    return { start: addDays(t, -7), end: addDays(t, 23) };
  }
  let start = visible.reduce((m,t) => minDate(m, t.startDate), visible[0].startDate);
  let end = visible.reduce((m,t) => maxDate(m, t.endDate), visible[0].endDate);
  const pad = Math.max(5, Math.round(dateDiff(start, end) * 0.1));
  return { start: addDays(start, -pad), end: addDays(end, pad) };
}

// ═══════════════════════════════════════════════════
// UNIFIED TIMELINE HEADER SVG BUILDER
// ═══════════════════════════════════════════════════
function buildTimelineHeaderSVG({ range, totalDays, pxDay, headerH, offsetX = 0, zoom, theme }) {
  const T = THEMES[theme];
  const rowH = headerH / 2;
  const MONTHS_FR = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
  const MONTHS_FULL = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  let html = '';

  // Background for the timeline area
  html += `<rect x="${offsetX}" width="${totalDays * pxDay}" height="${headerH}" fill="${T.surface2}"/>`;
  html += `<rect x="${offsetX}" y="${rowH}" width="${totalDays * pxDay}" height="${rowH}" fill="${T.surface}"/>`;

  if (zoom === 'days') {
    // Top: months
    let curMonth = -1, monthStartX = offsetX, curMonthYear = 0; // FIX: curMonthYear declared with let
    for (let i = 0; i <= totalDays; i++) {
      const d = parseDate(addDays(range.start, i));
      const m = d.getMonth(), y = d.getFullYear();
      if (m !== curMonth || i === totalDays) {
        if (curMonth !== -1) {
          const w = offsetX + i * pxDay - monthStartX;
          html += `<text x="${monthStartX + w/2}" y="${rowH/2 + 5}" text-anchor="middle" font-family="Outfit,sans-serif" font-size="11" font-weight="600" fill="${T.text}">${MONTHS_FULL[curMonth]} ${curMonthYear}</text>`;
          html += `<line x1="${offsetX + i * pxDay}" y1="0" x2="${offsetX + i * pxDay}" y2="${rowH}" stroke="${T.border}" stroke-width="1"/>`;
        }
        curMonth = m; curMonthYear = y; monthStartX = offsetX + i * pxDay;
      }
    }
    // Bottom: day numbers
    for (let i = 0; i < totalDays; i++) {
      const d = parseDate(addDays(range.start, i));
      const day = d.getDate(), dow = d.getDay();
      const x = offsetX + i * pxDay;
      const isWeekend = dow === 0 || dow === 6;
      const isToday = addDays(range.start, i) === today();
      if (isWeekend) html += `<rect x="${x}" y="${rowH}" width="${pxDay}" height="${rowH}" fill="rgba(255,255,255,0.03)"/>`;
      if (isToday) html += `<rect x="${x}" y="${rowH}" width="${pxDay}" height="${rowH}" fill="rgba(255,107,107,0.15)"/>`;
      if (pxDay >= 16) {
        html += `<text x="${x + pxDay/2}" y="${rowH + rowH/2 + 5}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="${isToday ? T.today : T.text2}">${day}</text>`;
      }
      html += `<line x1="${x}" y1="${rowH}" x2="${x}" y2="${headerH}" stroke="${T.border}" stroke-width="${pxDay >= 20 ? '1' : '0.5'}"/>`;
    }

  } else if (zoom === 'weeks') {
    // Top: months
    let curMonth = -1, monthStartX = offsetX, curMonthYear = 0; // FIX: curMonthYear declared with let
    for (let i = 0; i <= totalDays; i++) {
      const d = parseDate(addDays(range.start, i));
      const m = d.getMonth(), y = d.getFullYear();
      if (m !== curMonth || i === totalDays) {
        if (curMonth !== -1) {
          const w = offsetX + i * pxDay - monthStartX;
          html += `<text x="${monthStartX + w/2}" y="${rowH/2 + 5}" text-anchor="middle" font-family="Outfit,sans-serif" font-size="11" font-weight="600" fill="${T.text}">${MONTHS_FULL[curMonth]} ${curMonthYear}</text>`;
          html += `<line x1="${offsetX + i * pxDay}" y1="0" x2="${offsetX + i * pxDay}" y2="${rowH}" stroke="${T.border}" stroke-width="1"/>`;
        }
        curMonth = m; curMonthYear = y; monthStartX = offsetX + i * pxDay;
      }
    }
    // Bottom: ISO week numbers
    let prevWeek = -1;
    for (let i = 0; i < totalDays; i++) {
      const d = parseDate(addDays(range.start, i));
      const week = getISOWeek(d);
      const x = offsetX + i * pxDay;
      if (week !== prevWeek) {
        html += `<text x="${x + 2}" y="${rowH + rowH/2 + 5}" font-family="JetBrains Mono,monospace" font-size="10" fill="${T.text2}">S${week}</text>`;
        html += `<line x1="${x}" y1="${rowH}" x2="${x}" y2="${headerH}" stroke="${T.border}" stroke-width="1"/>`;
        prevWeek = week;
      }
    }

  } else if (zoom === 'years') {
    // Top: years
    let curYear = -1, yearStartX = offsetX;
    for (let i = 0; i <= totalDays; i++) {
      const d = parseDate(addDays(range.start, i));
      const y = d.getFullYear();
      if (y !== curYear || i === totalDays) {
        if (curYear !== -1) {
          const w = offsetX + i * pxDay - yearStartX;
          html += `<text x="${yearStartX + w/2}" y="${rowH/2 + 5}" text-anchor="middle" font-family="Outfit,sans-serif" font-size="12" font-weight="700" fill="${T.text}">${curYear}</text>`;
          html += `<line x1="${offsetX + i * pxDay}" y1="0" x2="${offsetX + i * pxDay}" y2="${rowH}" stroke="${T.border}" stroke-width="1.5"/>`;
        }
        curYear = y; yearStartX = offsetX + i * pxDay;
      }
    }
    // Bottom: quarters T1–T4
    const QUARTERS = ['T1','T2','T3','T4'];
    let prevQ = -1, prevYr = -1, qStartX = offsetX;
    for (let i = 0; i <= totalDays; i++) {
      const d = parseDate(addDays(range.start, i));
      const q = Math.floor(d.getMonth() / 3), y = d.getFullYear();
      if (q !== prevQ || y !== prevYr || i === totalDays) {
        if (prevQ !== -1) {
          const w = offsetX + i * pxDay - qStartX;
          if (w > 18) html += `<text x="${qStartX + w/2}" y="${rowH + rowH/2 + 5}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" font-weight="500" fill="${T.accent}">${QUARTERS[prevQ]}</text>`;
          html += `<line x1="${offsetX + i * pxDay}" y1="${rowH}" x2="${offsetX + i * pxDay}" y2="${headerH}" stroke="${T.border}" stroke-width="1"/>`;
        }
        prevQ = q; prevYr = y; qStartX = offsetX + i * pxDay;
      }
    }

  } else { // months
    // Top: years
    let curYear = -1, yearStartX = offsetX;
    for (let i = 0; i <= totalDays; i++) {
      const d = parseDate(addDays(range.start, i));
      const y = d.getFullYear();
      if (y !== curYear || i === totalDays) {
        if (curYear !== -1) {
          const w = offsetX + i * pxDay - yearStartX;
          html += `<text x="${yearStartX + w/2}" y="${rowH/2 + 5}" text-anchor="middle" font-family="Outfit,sans-serif" font-size="11" font-weight="600" fill="${T.text}">${curYear}</text>`;
          html += `<line x1="${offsetX + i * pxDay}" y1="0" x2="${offsetX + i * pxDay}" y2="${rowH}" stroke="${T.border}" stroke-width="1"/>`;
        }
        curYear = y; yearStartX = offsetX + i * pxDay;
      }
    }
    // Bottom: month abbreviations
    let curMonth = -1, monthStartX = offsetX;
    for (let i = 0; i <= totalDays; i++) {
      const d = parseDate(addDays(range.start, i));
      const m = d.getMonth();
      if (m !== curMonth || i === totalDays) {
        if (curMonth !== -1) {
          const w = offsetX + i * pxDay - monthStartX;
          html += `<text x="${monthStartX + w/2}" y="${rowH + rowH/2 + 5}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="${T.text2}">${MONTHS_FR[curMonth]}</text>`;
          html += `<line x1="${offsetX + i * pxDay}" y1="${rowH}" x2="${offsetX + i * pxDay}" y2="${headerH}" stroke="${T.border}" stroke-width="1"/>`;
        }
        curMonth = m; monthStartX = offsetX + i * pxDay;
      }
    }
  }

  // Separator lines
  html += `<line x1="${offsetX}" y1="${headerH - 1}" x2="${offsetX + totalDays * pxDay}" y2="${headerH - 1}" stroke="${T.border}" stroke-width="1"/>`;
  html += `<line x1="${offsetX}" y1="${rowH}" x2="${offsetX + totalDays * pxDay}" y2="${rowH}" stroke="${T.border}" stroke-width="1"/>`;

  return html;
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function render() {
  recalcAllSummaries();
  renderTaskList();
  renderGantt();
  updateStatusBar();
  saveToLocalStorage();
}

// ─── TASK LIST ───
function renderTaskList() {
  const body = document.getElementById('task-list-body');
  const empty = document.getElementById('empty-state');
  const rows = getVisibleRows();

  // Update search count badge
  if (searchQuery) {
    const matched = tasks.filter(t => t.name.toLowerCase().includes(searchQuery)).length;
    document.getElementById('search-count').textContent = `${matched}`;
  } else {
    document.getElementById('search-count').textContent = '';
  }

  if (tasks.length === 0) {
    body.innerHTML = '';
    body.appendChild(empty);
    empty.classList.add('visible');
    return;
  }
  empty.classList.remove('visible');
  body.innerHTML = '';
  body.appendChild(empty);

  rows.forEach(({ task, level }) => {
    const type = getTaskType(task);
    const isSummary = type === 'summary';
    const isMilestone = type === 'milestone';

    const row = document.createElement('div');
    row.className = 'task-row' + (isSummary ? ' summary-row' : '') + (task.id === selectedTaskId ? ' selected' : '');
    row.dataset.id = task.id;
    row.setAttribute('role', 'option');
    row.setAttribute('aria-selected', task.id === selectedTaskId ? 'true' : 'false');
    row.style.paddingLeft = (8 + level * 20) + 'px';
    row.onclick = (e) => { if (e.target.closest('button')) return; selectedTaskId = task.id; render(); };
    row.ondblclick = (e) => { if (e.target.closest('button')) return; openModal(null, task.id); };

    // Name cell
    const nameCell = document.createElement('div');
    nameCell.className = 'task-name-cell';

    // Drag grip
    const grip = document.createElement('div');
    grip.className = 'drag-grip';
    grip.innerHTML = '<svg width="10" height="14" viewBox="0 0 10 14" fill="none"><circle cx="3" cy="3" r="1.2" fill="currentColor"/><circle cx="7" cy="3" r="1.2" fill="currentColor"/><circle cx="3" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="3" cy="11" r="1.2" fill="currentColor"/><circle cx="7" cy="11" r="1.2" fill="currentColor"/></svg>';
    grip.title = 'Glisser pour déplacer';
    grip.setAttribute('aria-hidden', 'true');
    grip.addEventListener('mousedown', (e) => { e.stopPropagation(); startRowDrag(e, task.id); });
    nameCell.appendChild(grip);

    // Collapse button for summary
    if (isSummary) {
      const colBtn = document.createElement('button');
      colBtn.className = 'collapse-btn' + (task.collapsed ? ' collapsed' : '');
      colBtn.innerHTML = '<svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1 2l3 4 3-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      colBtn.title = task.collapsed ? 'Développer' : 'Réduire';
      colBtn.setAttribute('aria-expanded', task.collapsed ? 'false' : 'true');
      colBtn.onclick = (e) => { e.stopPropagation(); task.collapsed = !task.collapsed; render(); };
      nameCell.appendChild(colBtn);
    } else {
      const spacer = document.createElement('span');
      spacer.style.cssText = 'width:20px;flex-shrink:0';
      nameCell.appendChild(spacer);
    }

    // Type icon
    const icon = document.createElement('span');
    icon.className = 'type-icon';
    icon.setAttribute('aria-hidden', 'true');
    if (isMilestone) icon.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="2" y="2" width="6" height="6" fill="var(--milestone)" transform="rotate(45 5 5)"/></svg>';
    else if (isSummary) icon.innerHTML = '<svg width="12" height="10" viewBox="0 0 12 10" fill="none"><rect x="0" y="2" width="12" height="4" rx="2" fill="var(--summary)" opacity=".7"/></svg>';
    else icon.innerHTML = '<svg width="12" height="8" viewBox="0 0 12 8" fill="none"><rect x="0" y="0" width="12" height="8" rx="2" fill="var(--accent)" opacity=".7"/></svg>';
    nameCell.appendChild(icon);

    // Task label (with optional search highlight)
    const label = document.createElement('span');
    label.className = 'task-label' + (isSummary ? ' summary' : isMilestone ? ' milestone' : '');
    label.title = task.name;
    if (searchQuery && task.name.toLowerCase().includes(searchQuery)) {
      const idx = task.name.toLowerCase().indexOf(searchQuery);
      const before = escapeHtml(task.name.substring(0, idx));
      const match = escapeHtml(task.name.substring(idx, idx + searchQuery.length));
      const after = escapeHtml(task.name.substring(idx + searchQuery.length));
      label.innerHTML = `${before}<mark>${match}</mark>${after}`;
    } else {
      label.textContent = task.name;
    }
    nameCell.appendChild(label);

    row.appendChild(nameCell);

    // Date cells
    row.appendChild(makeInlineDateCell(task, 'start', isMilestone));
    row.appendChild(makeInlineDateCell(task, 'end', isMilestone));

    // Actions
    const actions = document.createElement('div');
    actions.className = 'task-actions';
    actions.setAttribute('aria-hidden', 'true');

    const editBtn = document.createElement('button');
    editBtn.className = 'act-btn';
    editBtn.title = 'Modifier (Entrée)';
    editBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 9.5l1.5-1.5 6-6 1.5 1.5-6 6L2 9.5z" stroke="currentColor" stroke-width="1.2"/><path d="M8 2.5l1.5 1.5" stroke="currentColor" stroke-width="1.2"/></svg>';
    editBtn.onclick = (e) => { e.stopPropagation(); openModal(null, task.id); };
    actions.appendChild(editBtn);

    if (type !== 'milestone') {
      const addSubBtn = document.createElement('button');
      addSubBtn.className = 'act-btn';
      addSubBtn.title = 'Ajouter une sous-tâche';
      addSubBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><line x1="6" y1="2" x2="6" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
      addSubBtn.onclick = (e) => { e.stopPropagation(); openModal('standard', null, task.id); };
      actions.appendChild(addSubBtn);
    }

    const delBtn = document.createElement('button');
    delBtn.className = 'act-btn danger';
    delBtn.title = 'Supprimer (Suppr)';
    delBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M5 3V2h2v1M3 3l.5 7h5L9 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    delBtn.onclick = (e) => { e.stopPropagation(); confirmDelete(task.id); };
    actions.appendChild(delBtn);

    row.appendChild(actions);
    body.appendChild(row);
  });
}

// ─── INLINE DATE EDITING ───
function makeInlineDateCell(task, field, isMilestone) {
  const cell = document.createElement('div');
  cell.className = 'task-date';
  cell.style.textAlign = 'center';

  function showLabel() {
    cell.classList.remove('editing');
    if (field === 'end' && isMilestone) { cell.textContent = '—'; return; }
    cell.textContent = formatDate(field === 'start' ? task.startDate : task.endDate);
  }

  function activateInput(e) {
    e.stopPropagation();
    if (field === 'end' && isMilestone) return;
    cell.classList.add('editing');
    cell.textContent = '';
    const input = document.createElement('input');
    input.type = 'date';
    input.className = 'inline-date-input';
    input.value = field === 'start' ? task.startDate : task.endDate;
    cell.appendChild(input);
    setTimeout(() => { input.focus(); }, 30);

    function commit() {
      const val = input.value;
      if (!val) { showLabel(); return; }
      if (field === 'start') {
        if (val > task.endDate) {
          const diff = dateDiff(task.startDate, task.endDate);
          pushUndo();
          task.startDate = val;
          task.endDate = addDays(val, diff);
        } else {
          pushUndo();
          task.startDate = val;
        }
      } else {
        if (val < task.startDate) {
          input.style.borderColor = 'var(--danger)';
          setTimeout(() => { input.style.borderColor = ''; }, 1500);
          return;
        }
        pushUndo();
        task.endDate = val;
      }
      render();
    }

    let cancelled = false;
    input.addEventListener('blur', () => { if (!cancelled) commit(); else showLabel(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter')  { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); cancelled = true; input.blur(); }
    });
  }

  showLabel();
  cell.addEventListener('click', activateInput);
  return cell;
}

// ─── GANTT ───
function renderGantt() {
  const range = getProjectRange();
  const pxDay = getPxPerDay();
  const totalDays = dateDiff(range.start, range.end) + 1;
  const totalW = totalDays * pxDay;
  const rows = getVisibleRows();
  const rowHPx = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--row-h'));
  const totalH = rows.length * rowHPx;

  // Header — uses unified builder
  const headerSVG = document.getElementById('gantt-header-svg');
  const headerH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-h'));
  headerSVG.setAttribute('width', totalW);
  headerSVG.setAttribute('height', headerH);
  headerSVG.innerHTML = buildTimelineHeaderSVG({
    range, totalDays, pxDay, headerH, offsetX: 0,
    zoom: currentZoom, theme: currentTheme
  });

  // Canvas
  const canvas = document.getElementById('gantt-canvas');
  canvas.style.width = totalW + 'px';
  canvas.style.height = totalH + 'px';
  canvas.innerHTML = '';

  renderGridLines(canvas, range, totalW, totalH, pxDay);

  // Today line
  const todayStr = today();
  if (todayStr >= range.start && todayStr <= range.end) {
    const x = dateDiff(range.start, todayStr) * pxDay;
    const line = document.createElement('div');
    line.className = 'today-line';
    line.style.cssText = `left:${x}px;height:${totalH}px;`;
    canvas.appendChild(line);
  }

  // Row backgrounds
  rows.forEach(({ task }, i) => {
    const bg = document.createElement('div');
    bg.className = 'gantt-row-bg ' + (task.type === 'summary' ? 'summary' : i % 2 === 0 ? 'even' : 'odd');
    bg.style.top = (i * rowHPx) + 'px';
    canvas.appendChild(bg);
  });

  const barH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--bar-h'));

  rows.forEach(({ task }, i) => {
    if (!task.startDate || !task.endDate) return;
    const type = getTaskType(task);
    const top = i * rowHPx;
    const x = dateDiff(range.start, task.startDate) * pxDay;

    if (type === 'milestone') {
      const size = 14;
      const diamond = document.createElement('div');
      diamond.className = 'milestone-diamond';
      diamond.style.cssText = `left:${x - size/2}px;top:${top + rowHPx/2 - size/2}px;width:${size}px;height:${size}px;`;
      diamond.dataset.id = task.id;
      addTooltipHandlers(diamond, buildTooltip(task));
      diamond.onclick = () => { selectedTaskId = task.id; renderTaskList(); };
      diamond.ondblclick = () => openModal(null, task.id);
      canvas.appendChild(diamond);

      const lbl = document.createElement('div');
      lbl.className = 'milestone-label';
      lbl.style.cssText = `left:${x + size/2 + 6}px;top:${top + rowHPx/2 - 8}px;`;
      lbl.textContent = task.name;
      canvas.appendChild(lbl);

    } else {
      const dur = dateDiff(task.startDate, task.endDate) + 1;
      const w = Math.max(4, dur * pxDay - 2);
      const isSummary = type === 'summary';

      const wrapper = document.createElement('div');
      wrapper.className = 'gantt-bar-wrapper';
      wrapper.style.cssText = `left:${x}px;top:${top + (rowHPx - barH)/2}px;width:${w}px;height:${barH}px;`;
      wrapper.dataset.id = task.id;

      const bar = document.createElement('div');
      bar.className = 'gantt-bar ' + (isSummary ? 'summary-bar' : 'standard');
      bar.style.width = '100%';
      bar.style.height = '100%';
      bar.dataset.id = task.id;

      if (!isSummary) {
        // Progress fill
        const progress = task.progress || 0;
        if (progress > 0) {
          const fill = document.createElement('div');
          fill.className = 'progress-fill';
          fill.style.width = `${progress}%`;
          bar.appendChild(fill);
        }
        const labelEl = document.createElement('div');
        labelEl.className = 'bar-label';
        labelEl.textContent = task.name;
        bar.appendChild(labelEl);
        const dragL = document.createElement('div');
        dragL.className = 'drag-handle-left';
        const dragR = document.createElement('div');
        dragR.className = 'drag-handle-right';
        bar.appendChild(dragL);
        bar.appendChild(dragR);
        makeDraggable(bar, task, range, pxDay);
      } else {
        const labelEl = document.createElement('div');
        labelEl.className = 'bar-label';
        labelEl.textContent = task.name;
        bar.appendChild(labelEl);
        const capL = document.createElement('div');
        capL.className = 'summary-cap-left';
        const capR = document.createElement('div');
        capR.className = 'summary-cap-right';
        bar.appendChild(capL);
        bar.appendChild(capR);
      }

      addTooltipHandlers(bar, buildTooltip(task));
      bar.onclick = (e) => {
        if (e.target.classList.contains('drag-handle-left') || e.target.classList.contains('drag-handle-right')) return;
        selectedTaskId = task.id; renderTaskList();
      };
      bar.ondblclick = () => openModal(null, task.id);

      wrapper.appendChild(bar);
      canvas.appendChild(wrapper);

      if (w < task.name.length * 7 + 12) {
        const lbl = document.createElement('div');
        lbl.className = 'bar-label-outside';
        lbl.style.top = '50%';
        lbl.style.transform = 'translateY(-50%)';
        lbl.textContent = task.name;
        wrapper.appendChild(lbl);
      }
    }
  });

  syncGanttHeaderScroll(document.getElementById('gantt-body').scrollLeft);
}

function renderGridLines(canvas, range, totalW, totalH, pxDay) {
  const totalDays = dateDiff(range.start, range.end) + 1;
  if (currentZoom === 'days') {
    for (let i = 0; i < totalDays; i++) {
      const d = parseDate(addDays(range.start, i));
      if (d.getDay() === 1 || pxDay >= 20) {
        const line = document.createElement('div');
        line.className = 'grid-line';
        line.style.cssText = `left:${i * pxDay}px;height:${totalH}px;${d.getDay() === 1 ? 'opacity:.4' : ''}`;
        canvas.appendChild(line);
      }
    }
  } else if (currentZoom === 'weeks') {
    for (let i = 0; i < totalDays; i++) {
      const d = parseDate(addDays(range.start, i));
      if (d.getDay() === 1) {
        const line = document.createElement('div');
        line.className = 'grid-line';
        line.style.cssText = `left:${i * pxDay}px;height:${totalH}px;`;
        canvas.appendChild(line);
      }
    }
  } else if (currentZoom === 'years') {
    let prevQ = -1, prevYear = -1;
    for (let i = 0; i < totalDays; i++) {
      const d = parseDate(addDays(range.start, i));
      const q = Math.floor(d.getMonth() / 3), y = d.getFullYear();
      if (q !== prevQ || y !== prevYear) {
        const line = document.createElement('div');
        line.className = 'grid-line';
        line.style.cssText = `left:${i * pxDay}px;height:${totalH}px;opacity:${q === 0 ? '0.7' : '0.35'};`;
        canvas.appendChild(line);
        prevQ = q; prevYear = y;
      }
    }
  } else {
    for (let i = 0; i < totalDays; i++) {
      const d = parseDate(addDays(range.start, i));
      if (d.getDate() === 1) {
        const line = document.createElement('div');
        line.className = 'grid-line';
        line.style.cssText = `left:${i * pxDay}px;height:${totalH}px;`;
        canvas.appendChild(line);
      }
    }
  }
}

function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

const tooltipEl = document.getElementById('tooltip');
function addTooltipHandlers(el, html) {
  el.addEventListener('mouseenter', (e) => { tooltipEl.innerHTML = html; tooltipEl.classList.add('visible'); moveTooltip(e); });
  el.addEventListener('mousemove', moveTooltip);
  el.addEventListener('mouseleave', () => tooltipEl.classList.remove('visible'));
}
function moveTooltip(e) {
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + 250 > window.innerWidth) x = e.clientX - 260;
  if (y + 80 > window.innerHeight) y = e.clientY - 80;
  tooltipEl.style.left = x + 'px'; tooltipEl.style.top = y + 'px';
}
function buildTooltip(task) {
  const type = getTaskType(task);
  const dur = type === 'milestone' ? 0 : dateDiff(task.startDate, task.endDate) + 1;
  let html = `<strong style="color:var(--text)">${task.name}</strong><br>`;
  if (type === 'summary') html += `<span style="color:var(--summary)">Tâche récapitulative</span><br>`;
  if (type === 'milestone') html += `<span style="color:var(--milestone)">Jalon</span><br>`;
  html += `<span style="color:var(--text2)">Début : ${formatDate(task.startDate)}</span><br>`;
  if (type !== 'milestone') html += `<span style="color:var(--text2)">Fin : ${formatDate(task.endDate)}</span><br>`;
  if (type !== 'milestone') html += `<span style="color:var(--text3)">Durée : ${dur} jour${dur > 1 ? 's' : ''}</span>`;
  if (type === 'standard' && task.progress > 0) html += `<br><span style="color:var(--accent)">Avancement : ${task.progress}%</span>`;
  if (task.description) html += `<br><span style="color:var(--text3);font-size:11px">${task.description.substring(0,100)}${task.description.length > 100 ? '…' : ''}</span>`;
  return html;
}

// ─── DRAG TO MOVE / RESIZE BARS (with rAF debounce + undo + date tooltip) ───
const dragDateTip = document.getElementById('drag-date-tip');

function makeDraggable(bar, task, range, pxDay) {
  bar.addEventListener('mousedown', (e) => {
    const isLeft = e.target.classList.contains('drag-handle-left');
    const isRight = e.target.classList.contains('drag-handle-right');
    const isMove = !isLeft && !isRight;
    e.preventDefault(); e.stopPropagation();

    pushUndo(); // Snapshot before drag

    const startX = e.clientX;
    const origStart = task.startDate;
    const origEnd = task.endDate;
    document.body.style.cursor = isMove ? 'grabbing' : 'ew-resize';

    let rafPending = false;
    let lastClientX = e.clientX;

    const onMove = (ev) => {
      lastClientX = ev.clientX;
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(() => {
        rafPending = false;
        const dx = lastClientX - startX;
        const days = Math.round(dx / pxDay);
        if (isMove) {
          task.startDate = addDays(origStart, days);
          task.endDate = addDays(origEnd, days);
        } else if (isLeft) {
          const newStart = addDays(origStart, days);
          if (newStart <= origEnd) task.startDate = newStart;
        } else {
          const newEnd = addDays(origEnd, days);
          if (newEnd >= origStart) task.endDate = newEnd;
        }
        // Show date tooltip
        dragDateTip.textContent = isMove
          ? `${formatDate(task.startDate)} → ${formatDate(task.endDate)}`
          : isLeft ? `Début : ${formatDate(task.startDate)}` : `Fin : ${formatDate(task.endDate)}`;
        dragDateTip.style.left = (lastClientX + 14) + 'px';
        dragDateTip.style.top = (ev.clientY - 28) + 'px';
        dragDateTip.classList.add('visible');
        render();
      });
    };
    const onUp = () => {
      document.body.style.cursor = '';
      dragDateTip.classList.remove('visible');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// MODAL — FOCUS TRAP

function trapFocus(el) {
  const focusable = el.querySelectorAll('input, textarea, button, select, [tabindex]:not([tabindex="-1"])');
  const first = focusable[0], last = focusable[focusable.length - 1];
  el.addEventListener('keydown', function ft(e) {
    if (e.key !== 'Tab') return;
    if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
    else { if (document.activeElement === last) { e.preventDefault(); first.focus(); } }
    if (!document.getElementById('modal-overlay').classList.contains('open')) el.removeEventListener('keydown', ft);
  });
}

function openModal(forcedType, editId = null, parentId = null) {
  editingTaskId = editId;
  editingParentId = parentId;
  editingForcedType = forcedType;

  const overlay = document.getElementById('modal-overlay');
  const titleEl = document.getElementById('modal-title');
  const progressGroup = document.getElementById('progress-group');

  if (editId !== null) {
    const task = tasks.find(t => t.id === editId);
    if (!task) return;
    document.getElementById('f-name').value = task.name;
    document.getElementById('f-desc').value = task.description || '';
    document.getElementById('f-start').value = task.startDate;
    document.getElementById('f-end').value = task.endDate;
    document.getElementById('f-progress').value = task.progress || 0;
    document.getElementById('f-progress-val').textContent = (task.progress || 0) + '%';
    const type = getTaskType(task);
    titleEl.textContent = type === 'milestone' ? 'Modifier le jalon' : type === 'summary' ? 'Modifier la tâche récapitulative' : 'Modifier la tâche';
    progressGroup.style.display = (type === 'milestone' || type === 'summary') ? 'none' : 'block';
  } else {
    const t = today();
    document.getElementById('f-name').value = '';
    document.getElementById('f-desc').value = '';
    document.getElementById('f-start').value = t;
    document.getElementById('f-end').value = forcedType === 'milestone' ? t : addDays(t, 7);
    document.getElementById('f-progress').value = 0;
    document.getElementById('f-progress-val').textContent = '0%';
    titleEl.textContent = forcedType === 'milestone' ? 'Nouveau jalon' : forcedType === 'summary' ? 'Nouvelle tâche récapitulative' : 'Nouvelle tâche';
    progressGroup.style.display = forcedType === 'milestone' || forcedType === 'summary' ? 'none' : 'block';
  }

  updateTypeBadge();
  overlay.classList.add('open');
  const modal = document.getElementById('modal');
  setTimeout(() => {
    document.getElementById('f-name').focus();
    trapFocus(modal);
  }, 100);
}

function updateTypeBadge() {
  const start = document.getElementById('f-start').value;
  const end = document.getElementById('f-end').value;
  const ind = document.getElementById('type-indicator');
  if (!start || !end) { ind.innerHTML = ''; return; }
  let type = editingForcedType;
  if (!type) type = (start === end) ? 'milestone' : 'standard';
  const labels = { standard: 'Tâche standard', milestone: 'Jalon', summary: 'Tâche récapitulative' };
  const dur = start === end ? 0 : dateDiff(start, end) + 1;
  const durText = type !== 'milestone' ? ` — ${dur} jour${dur > 1 ? 's' : ''}` : '';
  ind.innerHTML = `<span class="form-badge badge-${type === 'summary' ? 'summary' : type}">${labels[type]}${durText}</span>`;
  const progressGroup = document.getElementById('progress-group');
  if (progressGroup) progressGroup.style.display = (type === 'milestone' || type === 'summary') ? 'none' : 'block';
}

document.getElementById('f-start').addEventListener('change', updateTypeBadge);
document.getElementById('f-end').addEventListener('change', updateTypeBadge);

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingTaskId = null;
}

function saveTask() {
  const name = document.getElementById('f-name').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const start = document.getElementById('f-start').value;
  let end = document.getElementById('f-end').value;
  const progress = parseInt(document.getElementById('f-progress').value) || 0;

  if (!name) { document.getElementById('f-name').style.borderColor = 'var(--danger)'; return; }
  if (!start) { alert('Date de début requise'); return; }
  if (!end) end = start;
  if (end < start) { alert('La date de fin ne peut pas être antérieure à la date de début.'); return; }
  document.getElementById('f-name').style.borderColor = '';

  let type = editingForcedType;
  if (!type) type = (start === end) ? 'milestone' : 'standard';

  pushUndo();

  if (editingTaskId !== null) {
    const task = tasks.find(t => t.id === editingTaskId);
    task.name = name;
    task.description = desc;
    task.startDate = start;
    task.endDate = end;
    task.progress = progress;
    // FIX: was `!task.type === 'summary'` (always false) → correct comparison
    if (task.type !== 'summary') {
      task.type = type;
    }
  } else {
    const maxOrder = tasks.filter(t => t.parentId === (editingParentId || null))
      .reduce((m, t) => Math.max(m, t.order), -1);
    tasks.push({
      id: nextId++,
      name, description: desc,
      startDate: start, endDate: end,
      type: editingForcedType || type,
      parentId: editingParentId || null,
      order: maxOrder + 1,
      collapsed: false,
      progress: progress
    });
  }

  closeModal();
  render();
}

function confirmDelete(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  const children = getChildren(id);
  const overlay = document.getElementById('confirm-overlay');
  document.getElementById('confirm-title').textContent = `Supprimer "${task.name}" ?`;

  if (children.length > 0) {
    document.getElementById('confirm-msg').textContent = `Cette tâche récapitulative contient ${children.length} sous-tâche(s). Que souhaitez-vous faire ?`;
    document.getElementById('confirm-btns').innerHTML = `
      <button class="btn btn-ghost" onclick="closeConfirm()">Annuler</button>
      <button class="btn" style="background:var(--warning);color:#000;border-color:var(--warning)" onclick="deleteTask(${id}, true)">Remonter les sous-tâches</button>
      <button class="btn btn-danger" onclick="deleteTask(${id}, false)">Tout supprimer</button>`;
  } else {
    document.getElementById('confirm-msg').textContent = 'Cette action est irréversible.';
    document.getElementById('confirm-btns').innerHTML = `
      <button class="btn btn-ghost" onclick="closeConfirm()">Annuler</button>
      <button class="btn btn-danger" onclick="deleteTask(${id}, false)">Supprimer</button>`;
  }
  overlay.classList.add('open');
  setTimeout(() => overlay.querySelector('.btn-danger').focus(), 80);
}

function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('open');
}

function deleteTask(id, promoteChildren) {
  pushUndo();
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  closeConfirm();
  if (promoteChildren) {
    tasks.filter(t => t.parentId === id).forEach(t => t.parentId = task.parentId);
  } else {
    const desc = getDescendants(id);
    desc.forEach(did => { tasks = tasks.filter(t => t.id !== did); });
  }
  tasks = tasks.filter(t => t.id !== id);
  if (selectedTaskId === id) selectedTaskId = null;
  render();
}

function fitToView() {
  // FIX: single-pass, pick correct zoom then apply once
  const range = getProjectRange();
  const ganttBody = document.getElementById('gantt-body');
  const availW = ganttBody.offsetWidth;
  const projectDays = dateDiff(range.start, range.end);
  if (projectDays <= 0) return;

  let bestZoom = 'years';
  for (const z of ['days', 'weeks', 'months', 'years']) {
    if (projectDays * ZOOM_CONFIG[z] <= availW * 1.1) {
      bestZoom = z;
      break;
    }
  }
  setZoom(bestZoom);
  ganttBody.scrollLeft = 0;
  syncGanttHeaderScroll(0);
}

// ═══════════════════════════════════════════════════
// ROW DRAG & DROP REORDER
// ═══════════════════════════════════════════════════
function startRowDrag(e, taskId) {
  dragState = { taskId, startY: e.clientY, moved: false };
  document.addEventListener('mousemove', onRowDragMove);
  document.addEventListener('mouseup', onRowDragEnd);
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'grabbing';
  const row = document.querySelector(`.task-row[data-id="${taskId}"]`);
  if (row) row.classList.add('dragging-row');
}

function onRowDragMove(e) {
  if (!dragState) return;
  if (Math.abs(e.clientY - dragState.startY) > 4) dragState.moved = true;
  if (!dragState.moved) return;
  document.querySelectorAll('.drop-indicator').forEach(el => el.remove());
  const rows = [...document.querySelectorAll('.task-row:not(.dragging-row)')];
  const target = rows.find(r => {
    const rect = r.getBoundingClientRect();
    return e.clientY >= rect.top && e.clientY <= rect.bottom;
  });
  if (target) {
    const rect = target.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    const ind = document.createElement('div');
    ind.className = 'drop-indicator ' + (e.clientY < mid ? 'top' : 'bottom');
    target.appendChild(ind);
    dragState.targetId = parseInt(target.dataset.id);
    dragState.position = e.clientY < mid ? 'before' : 'after';
  } else {
    dragState.targetId = null;
    dragState.position = null;
  }
}

function onRowDragEnd(e) {
  document.removeEventListener('mousemove', onRowDragMove);
  document.removeEventListener('mouseup', onRowDragEnd);
  document.body.style.userSelect = '';
  document.body.style.cursor = '';
  document.querySelectorAll('.drop-indicator').forEach(el => el.remove());
  document.querySelectorAll('.dragging-row').forEach(el => el.classList.remove('dragging-row'));
  if (dragState && dragState.moved && dragState.targetId != null && dragState.targetId !== dragState.taskId) {
    pushUndo();
    applyRowReorder(dragState.taskId, dragState.targetId, dragState.position);
  }
  dragState = null;
}

function applyRowReorder(srcId, tgtId, position) {
  const src = tasks.find(t => t.id === srcId);
  const tgt = tasks.find(t => t.id === tgtId);
  if (!src || !tgt) return;
  if (getDescendants(srcId).includes(tgtId)) return;
  src.parentId = tgt.parentId;
  const siblings = tasks.filter(t => t.parentId === tgt.parentId && t.id !== srcId).sort((a,b) => a.order - b.order);
  const tgtIndex = siblings.findIndex(t => t.id === tgtId);
  const insertAt = position === 'before' ? tgtIndex : tgtIndex + 1;
  siblings.splice(insertAt, 0, src);
  siblings.forEach((t, i) => { t.order = i; });
  render();
}

// ═══════════════════════════════════════════════════
// EXPORT CSV
// ═══════════════════════════════════════════════════
function exportCSV() {
  const rows = getVisibleRows();
  const BOM = '\uFEFF';
  const header = 'ID;NOM;TYPE;NIVEAU;ID_PARENT;DATE_DEBUT;DATE_FIN;DUREE_JOURS;AVANCEMENT;DESCRIPTION\r\n';
  let body = '';
  for (const { task, level } of rows) {
    const type = getTaskType(task).toUpperCase();
    const dur = type === 'MILESTONE' ? 0 : dateDiff(task.startDate, task.endDate) + 1;
    const desc = (task.description || '').replace(/"/g, '""');
    const hasSpecial = desc.includes(';') || desc.includes('\n') || desc.includes('"');
    body += [
      task.id,
      `"${task.name.replace(/"/g, '""')}"`,
      type === 'MILESTONE' ? 'JALON' : type,
      level,
      task.parentId || '',
      task.startDate,
      task.endDate,
      dur,
      task.progress || 0,
      hasSpecial ? `"${desc}"` : desc
    ].join(';') + '\r\n';
  }
  const blob = new Blob([BOM + header + body], { type: 'text/csv;charset=utf-8' });
  downloadFile(blob, getFileName('csv'));
}

// ═══════════════════════════════════════════════════
// EXPORT SVG — uses unified buildTimelineHeaderSVG
// ═══════════════════════════════════════════════════
function openExportSVGModal() { document.getElementById('export-modal-overlay').style.display = 'flex'; }
function closeExportModal() { document.getElementById('export-modal-overlay').style.display = 'none'; }

function exportSVG() {
  closeExportModal();
  const T = THEMES[currentTheme];
  const scale = document.querySelector('input[name="svg-scale"]:checked').value;
  const period = document.querySelector('input[name="svg-period"]:checked').value;
  const scaleMap = { compact: 24, standard: 32, comfortable: 44 };
  const rowH = scaleMap[scale];
  const barH = Math.round(rowH * 0.55);
  const headerH = 52;
  const listW = 260;

  recalcAllSummaries();
  const rows = getVisibleRows();

  // FIX: compute full range first, THEN compute visible slice if needed
  const fullRange = getProjectRange();
  let range = fullRange;
  if (period === 'visible') {
    const ganttBody = document.getElementById('gantt-body');
    const pxDay0 = getPxPerDay();
    const sl = ganttBody.scrollLeft;
    const cw = ganttBody.offsetWidth;
    range = {
      start: addDays(fullRange.start, Math.floor(sl / pxDay0)),
      end: addDays(fullRange.start, Math.floor((sl + cw) / pxDay0))
    };
  }

  const pxDay = getPxPerDay();
  const totalDays = dateDiff(range.start, range.end) + 1;
  const ganttW = totalDays * pxDay;
  const totalW = listW + ganttW;
  const totalH = headerH + rows.length * rowH + 40;

  let svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" font-family="Arial,sans-serif">
<defs><style>text { font-family: Arial, sans-serif; }</style></defs>
<rect width="${totalW}" height="${totalH}" fill="${T.bg}"/>
<rect width="${listW}" height="${totalH}" fill="${T.surface}"/>
<line x1="${listW}" y1="0" x2="${listW}" y2="${totalH}" stroke="${T.border}" stroke-width="1"/>
<text x="12" y="${headerH/2 + 5}" font-size="13" font-weight="bold" fill="${T.text}">${escSVG(document.getElementById('project-name').value)}</text>
`;

  // Timeline header — unified function (offsetX = listW)
  svg += buildTimelineHeaderSVG({
    range, totalDays, pxDay, headerH, offsetX: listW,
    zoom: currentZoom, theme: currentTheme
  });

  // Row data
  rows.forEach(({ task, level }, i) => {
    const y = headerH + i * rowH;
    const type = getTaskType(task);
    const rowFill = type === 'summary' ? T.rowSum : i % 2 === 0 ? T.rowEven : T.rowOdd;
    svg += `<rect x="0" y="${y}" width="${totalW}" height="${rowH}" fill="${rowFill}"/>`;
    svg += `<line x1="0" y1="${y + rowH}" x2="${totalW}" y2="${y + rowH}" stroke="${T.border}" stroke-width="0.5"/>`;

    const indent = 8 + level * 16;
    const textY = y + rowH/2 + 4;

    if (type === 'milestone') {
      const dx = indent + 6, dy = y + rowH/2;
      svg += `<rect x="${dx-5}" y="${dy-5}" width="10" height="10" fill="#F0A500" transform="rotate(45 ${dx} ${dy})"/>`;
    } else if (type === 'summary') {
      svg += `<rect x="${indent}" y="${y + rowH/2 - 5}" width="${Math.min(50, listW - indent - 20)}" height="8" rx="2" fill="#8B5CF6" opacity="0.6"/>`;
    } else {
      svg += `<rect x="${indent}" y="${y + rowH/2 - 4}" width="10" height="8" rx="1.5" fill="#58A6FF" opacity="0.7"/>`;
    }

    const textColor = type === 'summary' ? (currentTheme==='dark'?'#BC8CFF':'#8250DF') : type === 'milestone' ? (currentTheme==='dark'?'#F0A500':'#BF8700') : T.text;
    const fontW = type === 'summary' ? 'bold' : 'normal';
    const nameX = indent + 14;
    const nameStr = escSVG(task.name);
    svg += `<text x="${nameX}" y="${textY}" font-size="${Math.max(9, rowH * 0.35)}" font-weight="${fontW}" fill="${textColor}">${nameStr.length > 28 ? nameStr.substring(0,26)+'…' : nameStr}</text>`;

    if (!task.startDate || !task.endDate) return;
    if (task.endDate < range.start || task.startDate > range.end) return;

    const clampedStart = maxDate(task.startDate, range.start);
    const barX = listW + dateDiff(range.start, clampedStart) * pxDay;

    if (type === 'milestone') {
      const mx = listW + dateDiff(range.start, task.startDate) * pxDay;
      const size = Math.max(8, barH * 0.7);
      const my = y + rowH/2;
      svg += `<rect x="${mx-size/2}" y="${my-size/2}" width="${size}" height="${size}" fill="#F0A500" stroke="#FBBF24" stroke-width="1.5" transform="rotate(45 ${mx} ${my})"/>`;
      svg += `<text x="${mx+size/2+4}" y="${my+4}" font-size="${Math.max(8,rowH*0.32)}" fill="#F0A500">${escSVG(task.name)}</text>`;
    } else {
      const clampedEnd = minDate(task.endDate, range.end);
      const dur = dateDiff(clampedStart, clampedEnd) + 1;
      const w = Math.max(4, dur * pxDay - 2);
      const bY = y + (rowH - barH) / 2;
      if (type === 'summary') {
        svg += `<rect x="${barX}" y="${bY+2}" width="${w}" height="${barH-4}" rx="2" fill="#8B5CF6"/>`;
        svg += `<polygon points="${barX},${bY+barH+2} ${barX+6},${bY+barH-4} ${barX-6},${bY+barH-4}" fill="#8B5CF6"/>`;
        svg += `<polygon points="${barX+w},${bY+barH+2} ${barX+w+6},${bY+barH-4} ${barX+w-6},${bY+barH-4}" fill="#8B5CF6"/>`;
      } else {
        svg += `<rect x="${barX}" y="${bY}" width="${w}" height="${barH}" rx="3" fill="#3B82F6"/>`;
        const progress = task.progress || 0;
        if (progress > 0) svg += `<rect x="${barX}" y="${bY}" width="${w * progress / 100}" height="${barH}" rx="3" fill="rgba(255,255,255,0.22)"/>`;
        if (w > 40) {
          const lbl = escSVG(task.name);
          svg += `<text x="${barX+5}" y="${bY+barH/2+4}" font-size="${Math.max(8,barH*0.55)}" fill="white" opacity="0.9">${lbl.length > Math.floor(w/6) ? lbl.substring(0,Math.floor(w/6))+'…' : lbl}</text>`;
        }
      }
    }
  });

  // Today line
  if (today() >= range.start && today() <= range.end) {
    const tx = listW + dateDiff(range.start, today()) * pxDay;
    svg += `<line x1="${tx}" y1="${headerH}" x2="${tx}" y2="${totalH-40}" stroke="${T.today}" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>`;
  }

  // Legend
  const legendY = totalH - 36;
  svg += `<rect x="0" y="${legendY}" width="${totalW}" height="36" fill="${T.legendBg}"/>`;
  svg += `<line x1="0" y1="${legendY}" x2="${totalW}" y2="${legendY}" stroke="${T.border}" stroke-width="1"/>`;
  svg += `<rect x="12" y="${legendY+12}" width="20" height="10" rx="2" fill="#3B82F6"/>`;
  svg += `<text x="38" y="${legendY+21}" font-size="10" fill="${T.text2}">Tâche standard</text>`;
  svg += `<rect x="140" y="${legendY+10}" width="12" height="12" fill="${currentTheme==='dark'?'#8B5CF6':'#8250DF'}"/>`;
  svg += `<text x="160" y="${legendY+21}" font-size="10" fill="${T.text2}">Tâche récapitulative</text>`;
  const mx = 300, my = legendY + 16;
  svg += `<rect x="${mx-6}" y="${my-6}" width="12" height="12" fill="#F0A500" transform="rotate(45 ${mx} ${my})"/>`;
  svg += `<text x="${mx+10}" y="${legendY+21}" font-size="10" fill="${T.text2}">Jalon</text>`;
  svg += `<line x1="${mx+55}" y1="${legendY+10}" x2="${mx+55}" y2="${legendY+26}" stroke="${T.today}" stroke-width="1.5" stroke-dasharray="3,2"/>`;
  svg += `<text x="${mx+62}" y="${legendY+21}" font-size="10" fill="${T.text2}">Aujourd'hui</text>`;
  svg += `\n</svg>`;

  downloadFile(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }), getFileName('svg'));
}

function escSVG(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════
// SAVE / LOAD
// ═══════════════════════════════════════════════════
function saveProject() {
  const data = { version: 2, name: document.getElementById('project-name').value, nextId, tasks };
  downloadFile(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), getFileName('json'));
  showSaveIndicator('Projet sauvegardé ✓');
}

function loadProject() { document.getElementById('file-input').click(); }

function onFileLoad(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.tasks) throw new Error('Format invalide');
      pushUndo();
      tasks = data.tasks;
      nextId = data.nextId || (Math.max(0, ...tasks.map(t => t.id)) + 1);
      document.getElementById('project-name').value = data.name || 'Projet chargé';
      selectedTaskId = null;
      render();
      showSaveIndicator('Projet chargé ✓');
    } catch(err) { alert('Erreur lors du chargement : ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function saveToLocalStorage() {
  const data = { version: 2, name: document.getElementById('project-name').value, nextId, tasks };
  localStorage.setItem('ganttPro_project', JSON.stringify(data));
}

function loadFromLocalStorage() {
  const raw = localStorage.getItem('ganttPro_project');
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    tasks = data.tasks || [];
    nextId = data.nextId || (Math.max(0, ...tasks.map(t => t.id)) + 1);
    document.getElementById('project-name').value = data.name || 'Mon Projet';
    return true;
  } catch { return false; }
}

function showSaveIndicator(msg) {
  const el = document.getElementById('sb-save');
  el.textContent = msg;
  setTimeout(() => el.textContent = '', 3000);
}

function getFileName(ext) {
  const name = (document.getElementById('project-name').value || 'projet').replace(/[^a-z0-9_-]/gi,'_');
  const d = new Date();
  const date = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  return `${name}_gantt_${date}.${ext}`;
}

function downloadFile(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ═══════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  const inInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';

  // Undo / Redo — always available
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }

  if (inInput) return;

  if (e.key === 'Escape') { closeModal(); closeConfirm(); closeExportModal(); }
  if (e.key === 'n' && !e.ctrlKey) openModal('standard');
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveProject(); }

  // Navigation clavier dans la liste
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const rows = getVisibleRows();
    if (!rows.length) return;
    const currentIndex = rows.findIndex(r => r.task.id === selectedTaskId);
    let newIndex = e.key === 'ArrowUp' ? Math.max(0, currentIndex - 1) : Math.min(rows.length - 1, currentIndex + 1);
    if (currentIndex === -1) newIndex = 0;
    selectedTaskId = rows[newIndex].task.id;
    renderTaskList();
    const rowEl = document.querySelector(`.task-row[data-id="${selectedTaskId}"]`);
    if (rowEl) rowEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  if (e.key === 'Enter' && selectedTaskId) { openModal(null, selectedTaskId); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedTaskId) { confirmDelete(selectedTaskId); }
});

document.getElementById('modal-body').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); saveTask(); }
});

  const loaded = loadFromLocalStorage();
  if (!loaded) loadDemoData();
  updateUndoRedoBtns();
  render();
  setTimeout(() => {
    const range = getProjectRange();
    const pxDay = getPxPerDay();
    const ganttBody = document.getElementById('gantt-body');
    const x = Math.max(0, dateDiff(range.start, today()) * pxDay - 80);
    ganttBody.scrollLeft = x;
    syncGanttHeaderScroll(x);
  }, 100);
})();
