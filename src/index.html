<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GanttPro — Planification de projet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>@@GANTT_STYLE@@</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="flex-shrink:0">
    <rect x="2" y="4" width="16" height="12" rx="2" stroke="#58A6FF" stroke-width="1.5"/>
    <line x1="6" y1="4" x2="6" y2="16" stroke="#58A6FF" stroke-width="1"/>
    <rect x="7" y="7" width="6" height="2" rx="1" fill="#3B82F6"/>
    <rect x="7" y="11" width="4" height="2" rx="1" fill="#8B5CF6" opacity=".7"/>
    <circle cx="9" cy="5" r="1" fill="#F0A500"/>
  </svg>
  <input id="project-name" type="text" value="Mon Projet" title="Cliquez pour renommer">
  <div class="tb-sep"></div>
  <button class="tb-btn primary" onclick="openModal('standard')" title="Ajouter une tâche">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="7" y1="2" x2="7" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="2" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Tâche
  </button>
  <button class="tb-btn" onclick="openModal('milestone')" title="Ajouter un jalon" style="color:var(--milestone)">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="3" y="3" width="6" height="6" fill="var(--milestone)" transform="rotate(45 6 6)"/></svg>
    Jalon
  </button>
  <button class="tb-btn" onclick="openModal('summary')" title="Ajouter une tâche récapitulative" style="color:var(--summary)">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="4" width="12" height="4" rx="2" fill="var(--summary)" opacity=".7"/><line x1="1" y1="10" x2="5" y2="10" stroke="var(--summary)" stroke-width="1.5" stroke-linecap="round"/><line x1="1" y1="12" x2="8" y2="12" stroke="var(--summary)" stroke-width="1.5" stroke-linecap="round"/></svg>
    Récapitulatif
  </button>
  <div class="tb-sep"></div>
  <div class="zoom-group">
    <button class="zoom-btn active" data-zoom="days" onclick="setZoom('days')">Jours</button>
    <button class="zoom-btn" data-zoom="weeks" onclick="setZoom('weeks')">Semaines</button>
    <button class="zoom-btn" data-zoom="months" onclick="setZoom('months')">Mois</button>
    <button class="zoom-btn" data-zoom="years" onclick="setZoom('years')">Années</button>
  </div>
  <button class="tb-btn" onclick="centerToday()" title="Centrer sur aujourd'hui">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/></svg>
    Aujourd'hui
  </button>
  <button class="tb-btn" onclick="fitToView()" title="Ajuster à la vue">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 5V2h3M9 2h3v3M12 9v3H9M5 12H2v-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Ajuster
  </button>
  <button id="theme-toggle" onclick="toggleTheme()" title="Basculer thème clair / sombre">
    <svg id="theme-icon" width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/><line x1="7" y1="1" x2="7" y2="2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="7" y1="11.5" x2="7" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="1" y1="7" x2="2.5" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11.5" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="2.93" y1="2.93" x2="4" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="10" y1="10" x2="11.07" y2="11.07" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11.07" y1="2.93" x2="10" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="10" x2="2.93" y2="11.07" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span id="theme-label">Clair</span>
  </button>
  <div id="toolbar-right">
    <button class="tb-btn" onclick="saveProject()" title="Sauvegarder en JSON">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2h8l2 2v8a1 1 0 01-1 1H3a1 1 0 01-1-1V2z" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="2" width="4" height="3" fill="currentColor" opacity=".4"/><rect x="3" y="8" width="8" height="4" rx="1" fill="currentColor" opacity=".3"/></svg>
      Sauvegarder
    </button>
    <button class="tb-btn" onclick="loadProject()" title="Charger un projet JSON">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 8v3a1 1 0 001 1h8a1 1 0 001-1V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M7 2v7M4 6l3-3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Charger
    </button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="exportCSV()" title="Exporter en CSV">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="3" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><line x1="4" y1="3" x2="4" y2="12" stroke="currentColor" stroke-width="1"/><line x1="8" y1="3" x2="8" y2="12" stroke="currentColor" stroke-width="1"/><line x1="1" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1"/></svg>
      CSV
    </button>
    <button class="tb-btn" onclick="exportMarkdown()" title="Exporter en Markdown (tableau + Mermaid Gantt)">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="2" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 9V5l2 2 2-2v4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 7l-1.5 2M10 7l1.5 2M10 7V5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      MD
    </button>
    <button class="tb-btn" onclick="openExportSVGModal()" title="Exporter en SVG pour LibreOffice">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="2" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><circle cx="4" cy="5.5" r="1" fill="currentColor" opacity=".5"/><path d="M1 9l3-3 3 3 3-4 3 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      SVG
    </button>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <!-- LEFT: Task list -->
  <div id="left-panel">
    <div id="list-header">
      <div class="lh-cell" style="display:flex;align-items:center;overflow:hidden">
        <span style="white-space:nowrap">Tâche</span>
        <div class="search-wrapper">
          <input id="search-input" type="text" placeholder="Rechercher…" oninput="onSearch(this.value)" aria-label="Rechercher une tâche">
          <button id="search-clear" onclick="clearSearch()" title="Effacer la recherche" aria-label="Effacer la recherche">✕</button>
        </div>
        <span id="search-count" class="search-count"></span>
      </div>
      <div class="lh-cell" style="text-align:center">Début</div>
      <div class="lh-cell" style="text-align:center">Fin</div>
      <div class="lh-cell"></div>
    </div>
    <div id="task-list-body">
      <div id="empty-state">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect x="6" y="10" width="36" height="28" rx="4" stroke="#8B949E" stroke-width="2"/>
          <line x1="14" y1="10" x2="14" y2="38" stroke="#8B949E" stroke-width="1.5"/>
          <rect x="16" y="18" width="18" height="3" rx="1.5" fill="#8B949E" opacity=".6"/>
          <rect x="16" y="24" width="12" height="3" rx="1.5" fill="#8B949E" opacity=".4"/>
        </svg>
        <p>Aucune tâche. Commencez par en ajouter une.</p>
      </div>
    </div>
  </div>

  <!-- SPLITTER -->
  <div id="splitter"></div>

  <!-- RIGHT: Gantt -->
  <div id="right-panel">
    <div id="gantt-header">
      <svg id="gantt-header-svg"></svg>
    </div>
    <div id="gantt-body">
      <div id="gantt-canvas"></div>
    </div>
  </div>
</div>

<!-- STATUS BAR -->
<div id="statusbar">
  <div class="sb-item">Tâches : <span id="sb-count">0</span></div>
  <div class="sb-item">Jalons : <span id="sb-milestones">0</span></div>
  <div class="sb-item">Durée projet : <span id="sb-duration">—</span></div>
  <div class="sb-item" id="sb-save" style="margin-left:auto;color:var(--success)"></div>
</div>

<!-- TASK MODAL -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <div id="modal-header">
      <div id="modal-title">Nouvelle tâche</div>
      <button id="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body">
      <div class="form-group">
        <label class="form-label">Nom de la tâche *</label>
        <input class="form-input" id="f-name" type="text" placeholder="Ex: Développement du module auth" maxlength="255">
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="f-desc" placeholder="Description détaillée, critères d'acceptation…"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date de début *</label>
          <input class="form-input" id="f-start" type="date">
        </div>
        <div class="form-group">
          <label class="form-label">Date de fin *</label>
          <input class="form-input" id="f-end" type="date">
        </div>
      </div>
      <div id="type-indicator"></div>
      <div class="form-group" id="demote-summary-group" style="display:none">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--text2)">
          <input type="checkbox" id="f-demote-summary">
          <span>Reclasser en tâche standard (cette tâche récapitulative n'a plus de sous-tâche)</span>
        </label>
      </div>
      <div class="form-group" id="promote-summary-group" style="display:none">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--text2)">
          <input type="checkbox" id="f-promote-summary">
          <span>Convertir en tâche récapitulative (sans sous-tâche pour l'instant)</span>
        </label>
      </div>
    </div>
    <div id="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" id="modal-save-btn" onclick="saveTask()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- EXPORT SVG MODAL -->
<div id="export-modal-overlay" onclick="if(event.target===this)closeExportModal()" style="position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;">
  <div id="export-modal" style="background:var(--surface);border:1px solid var(--border2);border-radius:12px;width:440px;box-shadow:0 24px 64px rgba(0,0,0,.6);animation:modal-in .2s cubic-bezier(.34,1.56,.64,1)">
    <div style="padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
      <div style="font-size:16px;font-weight:600">Export SVG — LibreOffice Impress</div>
      <button style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:18px;" onclick="closeExportModal()">✕</button>
    </div>
    <div style="padding:20px 24px">
      <div class="form-group">
        <label class="form-label">Hauteur de ligne</label>
        <div class="export-option"><input type="radio" name="svg-scale" value="compact" id="sc-compact"><label for="sc-compact" style="cursor:pointer"><strong>Compact</strong> — 24px par ligne</label></div>
        <div class="export-option" style="border-color:var(--accent);background:var(--accent-dim)"><input type="radio" name="svg-scale" value="standard" id="sc-standard" checked><label for="sc-standard" style="cursor:pointer"><strong>Standard</strong> — 32px par ligne (recommandé)</label></div>
        <div class="export-option"><input type="radio" name="svg-scale" value="comfortable" id="sc-comfortable"><label for="sc-comfortable" style="cursor:pointer"><strong>Confortable</strong> — 44px par ligne</label></div>
      </div>
      <div class="form-group">
        <label class="form-label">Période</label>
        <div class="export-option"><input type="radio" name="svg-period" value="all" id="sp-all" checked><label for="sp-all" style="cursor:pointer">Tout le projet</label></div>
        <div class="export-option"><input type="radio" name="svg-period" value="visible" id="sp-visible"><label for="sp-visible" style="cursor:pointer">Période visible à l'écran</label></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:10px;background:var(--surface2);border-radius:8px;font-size:12px;color:var(--text2)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="var(--accent)" stroke-width="1.5"/><line x1="8" y1="7" x2="8" y2="11" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="5" r="1" fill="var(--accent)"/></svg>
        Dans LibreOffice Impress : <strong style="color:var(--text)">Insertion → Image</strong> puis sélectionner le fichier SVG
      </div>
    </div>
    <div style="padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;">
      <button class="btn btn-ghost" onclick="closeExportModal()">Annuler</button>
      <button class="btn btn-primary" onclick="exportSVG()">Exporter SVG</button>
    </div>
  </div>
</div>

<!-- NEST MODAL -->
<div id="nest-overlay" onclick="if(event.target===this)closeNestModal()" style="position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border2);border-radius:12px;width:420px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.6);animation:modal-in .2s cubic-bezier(.34,1.56,.64,1)">
    <div style="padding:18px 24px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
      <div style="font-size:15px;font-weight:600">Nester la tâche dans…</div>
      <button onclick="closeNestModal()" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:18px;">✕</button>
    </div>
    <div style="padding:12px 16px;overflow-y:auto;flex:1;" id="nest-list"></div>
    <div style="padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;">
      <button class="btn btn-ghost" onclick="closeNestModal()">Annuler</button>
    </div>
  </div>
</div>

<!-- CONFIRM DIALOG -->
<div id="confirm-overlay">
  <div id="confirm-box">
    <div id="confirm-title"></div>
    <div id="confirm-msg"></div>
    <div id="confirm-btns"></div>
  </div>
</div>

<!-- TOOLTIP -->
<div id="tooltip"></div>

<!-- HIDDEN FILE INPUT -->
<input type="file" id="file-input" accept=".json" style="display:none" onchange="onFileLoad(event)">

<script>@@GANTT_SCRIPT@@</script>
</body>
</html>
